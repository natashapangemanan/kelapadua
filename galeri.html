<style>
  /* ===== Galeri Foto: grid foto asli ===== */
  .photo-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .photo-gallery .tile{
    aspect-ratio:4/3;
    overflow:hidden;
    border-radius:var(--radius);
    background:var(--surface-alt);
  }
  .photo-gallery .tile img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .photo-gallery .tile:hover img{transform:scale(1.06);}
  @media (max-width:700px){.photo-gallery{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
